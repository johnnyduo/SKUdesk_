<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SKUdesk walkthrough renderer</title>
<style>
  @font-face { font-family: 'Instrument Serif'; src: url('../apps/web/public/fonts/instrument-serif.woff2') format('woff2'); font-weight: 400; }
  @font-face { font-family: 'Inter'; src: url('../apps/web/public/fonts/inter.woff2') format('woff2'); font-weight: 100 900; }
  @font-face { font-family: 'JetBrains Mono'; src: url('../apps/web/public/fonts/jetbrains-mono.woff2') format('woff2'); font-weight: 100 800; }
  :root {
    --bg: #080908; --ink: #F5F6F2; --neon: #CCFF00; --blue: #016BE5; --cyan: #10E1FF;
    --mut: #9BA096; --line: rgba(245,246,242,.14);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
  body { font-family: 'Inter', sans-serif; color: var(--ink); }
  #stage { position: absolute; inset: 0; }
  .layer { position: absolute; inset: 0; opacity: 0; will-change: opacity; }
  .layer img.kb { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; will-change: transform; }

  /* ---- panel scenes (exhibit card on brand backdrop) ---- */
  .panelbg { position: absolute; inset: 0; background: #060706; }
  .panelbg::before, .panelbg::after { content: ""; position: absolute; border-radius: 50%; filter: blur(10px); }
  .panelbg::before { width: 1100px; height: 1100px; left: -320px; top: -380px; background: radial-gradient(circle, rgba(1,107,229,.20), transparent 65%); }
  .panelbg::after { width: 950px; height: 950px; right: -280px; bottom: -360px; background: radial-gradient(circle, rgba(204,255,0,.09), transparent 65%); }
  .panelcard { position: absolute; left: 50%; top: 50%; width: 1720px; height: auto; max-height: 900px; transform: translate(-50%,-50%);
    background: #0A0B0A; border: 1px solid var(--line); border-radius: 22px; padding: 30px;
    box-shadow: 0 40px 120px rgba(0,0,0,.55), 0 2px 0 rgba(255,255,255,.04) inset; display: flex; align-items: center; justify-content: center; }
  .panelcard img { max-width: 1660px; max-height: 800px; object-fit: contain; border-radius: 10px; }

  /* ---- shared overlay chrome ---- */
  #vig { position: absolute; inset: 0; pointer-events: none; z-index: 60;
    background: radial-gradient(ellipse at center, transparent 58%, rgba(0,0,0,.30) 100%); }
  #shade-b { position: absolute; left: 0; right: 0; bottom: 0; height: 260px; pointer-events: none; z-index: 60;
    background: linear-gradient(transparent, rgba(5,6,5,.62)); }
  #shade-t { position: absolute; left: 0; right: 0; top: 0; height: 170px; pointer-events: none; z-index: 60;
    background: linear-gradient(rgba(5,6,5,.55), transparent); }

  #lower { position: absolute; left: 64px; top: 52px; z-index: 70; display: flex; align-items: center; gap: 16px;
    font-family: 'JetBrains Mono', monospace; font-size: 19px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--ink); opacity: 0; }
  #lower .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--neon); box-shadow: 0 0 14px var(--neon); }
  #lower .num { color: var(--neon); }
  #lower .ttl { color: var(--ink); }
  #lower .sep { color: var(--mut); }

  #caps { position: absolute; left: 50%; bottom: 74px; transform: translateX(-50%); z-index: 70; max-width: 1500px;
    background: rgba(8,9,8,.76); border: 1px solid rgba(245,246,242,.15); border-left: 3px solid var(--neon);
    border-radius: 12px; padding: 16px 30px; font-size: 35px; font-weight: 600; line-height: 1.35; text-align: center;
    color: var(--ink); text-shadow: 0 1px 2px rgba(0,0,0,.6); opacity: 0; }

  #prog { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(245,246,242,.08); z-index: 71; }
  #prog i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--neon); box-shadow: 0 0 12px rgba(204,255,0,.8); }
  .tick { position: absolute; top: 0; bottom: 0; width: 2px; background: rgba(5,6,5,.9); }

  /* ---- intro / outro art ---- */
  .art { position: absolute; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .glow1, .glow2 { position: absolute; border-radius: 50%; filter: blur(6px); opacity: 0; }
  .glow1 { width: 1200px; height: 1200px; left: -360px; top: -420px; background: radial-gradient(circle, rgba(1,107,229,.34), transparent 65%); }
  .glow2 { width: 1000px; height: 1000px; right: -320px; bottom: -400px; background: radial-gradient(circle, rgba(204,255,0,.14), transparent 65%); }
  .stack { position: relative; display: flex; flex-direction: column; align-items: center; }
  #mark path { will-change: stroke-dashoffset; }
  .word { font-weight: 800; letter-spacing: -.035em; line-height: 1; opacity: 0; }
  .word .a { color: var(--neon); } .word .b { color: var(--ink); }
  .tagline { font-size: 34px; font-weight: 400; color: var(--mut); opacity: 0; }
  .chip { font-family: 'JetBrains Mono', monospace; font-size: 20px; letter-spacing: .1em; color: var(--neon);
    border: 1px solid rgba(204,255,0,.4); background: rgba(204,255,0,.06); border-radius: 999px; padding: 10px 26px; opacity: 0;
    display: flex; align-items: center; gap: 12px; }
  .chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--neon); box-shadow: 0 0 12px var(--neon); }
  .serif { font-family: 'Instrument Serif', serif; font-weight: 400; letter-spacing: -.01em; }
  .muted { color: var(--mut); }
  .routes { display: flex; gap: 18px; opacity: 0; }
  .routes span { font-family: 'JetBrains Mono', monospace; font-size: 20px; color: var(--ink); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px 20px; background: rgba(255,255,255,.02); }
  .routes b { color: var(--neon); font-weight: 700; }
  .fineprint { font-family: 'JetBrains Mono', monospace; font-size: 18px; letter-spacing: .06em; color: var(--mut); opacity: 0; }


  #black { position: absolute; inset: 0; background: #000; z-index: 90; pointer-events: none; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="vig"></div><div id="shade-t"></div><div id="shade-b"></div>
<div id="lower"><span class="dot"></span><span class="num"></span><span class="sep">/</span><span class="ttl"></span></div>
<div id="caps"></div>
<div id="prog"><i></i></div>
<div id="black"></div>
<script src="renderer-data.js"></script>
<script>
'use strict';
const D = window.__DATA, W = D.width, H = D.height, XF = D.xfade;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, q) => a + (b - a) * q;
const ease = (q) => (q < .5 ? 4 * q * q * q : 1 - Math.pow(-2 * q + 2, 3) / 2);
const ramp = (t, a, b) => clamp((t - a) / (b - a), 0, 1);          // 0→1 between a..b
const win = (t, a, b, f) => clamp(Math.min(ramp(t, a, a + f), 1 - ramp(t, b - f, b)), 0, 1);
const $ = (h) => { const d = document.createElement('div'); d.innerHTML = h; return d.firstElementChild; };
const MARK = (size) => `<svg id="mark" width="${size}" height="${size}" viewBox="0 0 128 128" fill="none" aria-hidden="true">
  <path d="M17 28 45 64 17 100" stroke="#CCFF00" stroke-width="12" stroke-linecap="square" pathLength="100"/>
  <path d="m111 28-28 36 28 36" stroke="#016BE5" stroke-width="12" stroke-linecap="square" pathLength="100"/>
  <g class="case"><rect x="49" y="48" width="30" height="32" rx="2" fill="#080908" stroke="#F5F6F2" stroke-width="5"/>
  <path d="M49 58h30M64 49v9" stroke="#F5F6F2" stroke-width="4"/></g></svg>`;

const stage = document.getElementById('stage');
const capsEl = document.getElementById('caps');
const lowerEl = document.getElementById('lower');
const lowerNum = lowerEl.querySelector('.num'), lowerTtl = lowerEl.querySelector('.ttl');
const progEl = document.querySelector('#prog i');
const progBox = document.getElementById('prog');
const blackEl = document.getElementById('black');

// tick marks at scene boundaries
for (const s of D.scenes) { if (s.start > 0) { const t = document.createElement('div'); t.className = 'tick'; t.style.left = `${(s.start / D.total) * 100}%`; progBox.appendChild(t); } }

const sceneEls = D.scenes.map((sc) => {
  let el;
  if (sc.kind === 'full') {
    el = $(`<div class="layer"><img class="kb" src="${sc.image}"></div>`);
  } else if (sc.kind === 'panel') {
    el = $(`<div class="layer"><div class="panelbg"></div><div class="panelcard"><img src="${sc.image}"></div></div>`);
  } else if (sc.kind === 'intro') {
    el = $(`<div class="layer"><div class="art">
      <div class="glow1"></div><div class="glow2"></div>
      <div class="stack" style="gap:34px">
        ${MARK(150)}
        <div class="word" style="font-size:158px"><span class="a">SKU</span><span class="b">desk</span></div>
        <div class="tagline">One price you can trust, only for the same item.</div>
        <div class="chip" style="margin-top:10px">GEMINI · CLOUD RUN · FIRESTORE</div>
      </div></div></div>`);
  } else if (sc.kind === 'outro') {
    el = $(`<div class="layer"><div class="art">
      <div class="glow1"></div><div class="glow2"></div>
      <div class="stack" style="gap:30px">
        <div style="display:flex;align-items:center;gap:26px">${MARK(92)}
          <div class="word" style="font-size:104px"><span class="a">SKU</span><span class="b">desk</span></div></div>
        <div class="serif" style="font-size:66px;margin-top:16px">Try it yourself.</div>
        <div class="chip" style="font-size:24px;margin-top:8px">skudesk.lol</div>
        <div class="routes" style="margin-top:10px">
          <span><b>/app</b> — the desk</span><span><b>/show</b> — replay a check</span><span><b>/market</b> — the offer ladder</span>
        </div>
        <div class="fineprint" style="margin-top:14px">ASKING PRICES · NOTHING IS BOUGHT WITHOUT A PERSON</div>
      </div></div></div>`);
  }
  stage.appendChild(el);
  return el;
});

// prime image decode + fonts, then report ready
window.__ready = Promise.all([
  ...[...document.querySelectorAll('img')].map((im) => im.decode().catch(() => {})),
  document.fonts.ready,
]);


function setFull(el, m, q) {
  const s = lerp(m.from.s, m.to.s, q), fx = lerp(m.from.fx, m.to.fx, q), fy = lerp(m.from.fy, m.to.fy, q);
  const x = fx * ((s - 1) / 2) * W, y = fy * ((s - 1) / 2) * H;
  el.firstElementChild.style.transform = `translate(${x.toFixed(2)}px,${y.toFixed(2)}px) scale(${s.toFixed(4)})`;
}

window.__setTime = (t) => {
  const last = D.scenes[D.scenes.length - 1];
  D.scenes.forEach((sc, i) => {
    const el = sceneEls[i];
    const lt = t - sc.start;
    let op = 1;
    if (i > 0) op *= ramp(t, sc.start - XF / 2, sc.start + XF / 2);
    if (sc !== last) op *= 1 - ramp(t, sc.start + sc.dur - XF / 2, sc.start + sc.dur + XF / 2);
    // settle-in drift for full/panel scenes (tiny push after the cut)
    el.style.opacity = op.toFixed(4);
    el.style.visibility = op <= 0.001 ? 'hidden' : 'visible';
    if (op <= 0.001) return;
    const q = ease(clamp(lt / sc.dur, 0, 1));
    if (sc.kind === 'full') setFull(el, sc.motion, q);
    else if (sc.kind === 'panel') {
      const s = lerp(sc.motion.from.s, sc.motion.to.s, q);
      el.querySelector('.panelcard').style.transform = `translate(-50%,-50%) scale(${s.toFixed(4)})`;
    } else if (sc.kind === 'intro') {
      el.querySelector('.glow1').style.opacity = ramp(lt, 0, 1.4).toFixed(3);
      el.querySelector('.glow2').style.opacity = ramp(lt, .2, 1.6).toFixed(3);
      const paths = el.querySelectorAll('#mark path');
      const dL = 1 - ramp(lt, .5, 1.9), dB = 1 - ramp(lt, 1.0, 2.4);
      paths[0].style.strokeDasharray = '100'; paths[0].style.strokeDashoffset = (dL * 100).toFixed(2);
      paths[1].style.strokeDasharray = '100'; paths[1].style.strokeDashoffset = (dB * 100).toFixed(2);
      const cs = el.querySelector('.case');
      const cq = ease(ramp(lt, 2.0, 2.7));
      cs.style.opacity = cq.toFixed(3);
      cs.style.transform = `translateY(${((1 - cq) * 14).toFixed(2)}px)`;
      const wq = ease(ramp(lt, 2.5, 3.3));
      const word = el.querySelector('.word');
      word.style.opacity = wq.toFixed(3);
      word.style.transform = `translateY(${((1 - wq) * 26).toFixed(2)}px)`;
      el.querySelector('.tagline').style.opacity = ease(ramp(lt, 3.2, 4.0)).toFixed(3);
      el.querySelector('.chip').style.opacity = ease(ramp(lt, 3.7, 4.5)).toFixed(3);
    } else if (sc.kind === 'outro') {
      el.querySelector('.glow1').style.opacity = ramp(lt, 0, 1.2).toFixed(3);
      el.querySelector('.glow2').style.opacity = ramp(lt, .2, 1.4).toFixed(3);
      const paths = el.querySelectorAll('#mark path');
      paths[0].style.strokeDasharray = '100'; paths[0].style.strokeDashoffset = ((1 - ramp(lt, .2, 1.1)) * 100).toFixed(2);
      paths[1].style.strokeDasharray = '100'; paths[1].style.strokeDashoffset = ((1 - ramp(lt, .5, 1.4)) * 100).toFixed(2);
      const cs = el.querySelector('.case'); cs.style.opacity = ramp(lt, 1.0, 1.5).toFixed(3);
      const pairs = [[el.querySelector('.word'), .9, 1.6], [el.querySelector('.serif'), 1.4, 2.2], [el.querySelector('.chip'), 2.0, 2.8], [el.querySelector('.routes'), 2.6, 3.5], [el.querySelector('.fineprint'), 3.2, 4.1]];
      for (const [n, a, b] of pairs) { const q2 = ease(ramp(lt, a, b)); n.style.opacity = q2.toFixed(3); n.style.transform = `translateY(${((1 - q2) * 18).toFixed(2)}px)`; }
    }
  });

  // subtitles
  let cap = null;
  const active = D.scenes.filter((s) => t >= s.start && t <= s.start + s.dur).pop() ?? D.scenes[0];
  const lt = t - active.start;
  for (const c of active.caps) if (lt >= c.t0 - .12 && lt <= c.t1 + .35) cap = c;
  if (cap) {
    if (capsEl.textContent !== cap.text) capsEl.textContent = cap.text;
    const f = .25;
    const o = Math.min(ramp(lt, cap.t0 - .12, cap.t0 - .12 + f), 1 - ramp(lt, cap.t1 + .35 - f, cap.t1 + .35));
    capsEl.style.opacity = clamp(o, 0, 1).toFixed(3);
  } else capsEl.style.opacity = '0';

  // lower third
  const lw = win(lt, .8, active.dur - .7, .45);
  if (lw > 0) {
    const want = active.chapter ?? String(active.num).padStart(2, '0');
    if (lowerNum.textContent !== want) {
      lowerNum.textContent = want;
      lowerTtl.textContent = active.title;
      const sep = lowerEl.querySelector('.sep');
      sep.style.display = active.chapter ? 'none' : '';
    }
    lowerEl.style.opacity = lw.toFixed(3);
  } else lowerEl.style.opacity = '0';

  progEl.style.width = `${(t / D.total) * 100}%`;
  blackEl.style.opacity = Math.max(1 - ramp(t, 0, .7), ramp(t, D.total - 1.0, D.total)).toFixed(3);
};
</script>
</body>
</html>
